version: '3.8'

services:
  # 前端应用
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

  # API网关
  api-gateway:
    build:
      context: ./packages/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:3001
      - CARBON_SERVICE_URL=http://carbon-service:3002
      - MONITOR_SERVICE_URL=http://monitor-service:3003
      - TRADE_SERVICE_URL=http://trade-service:3004
      - CBAM_SERVICE_URL=http://cbam-service:3005
      - VERIFY_SERVICE_URL=http://verify-service:3006
      - KNOWLEDGE_SERVICE_URL=http://knowledge-service:3007
      - REPORT_SERVICE_URL=http://report-service:3008
      - SYSTEM_SERVICE_URL=http://system-service:3009
      - AGENT_SERVICE_URL=http://ai-agent:8000
    depends_on:
      - auth-service
      - carbon-service
      - monitor-service
    restart: unless-stopped

  # 认证服务
  auth-service:
    build:
      context: ./packages/auth-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=carbon_main
      - DB_USER=carbon
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  # 碳核算服务
  carbon-service:
    build:
      context: ./packages/carbon-service
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=carbon_main
      - DB_USER=carbon
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  # 碳监测服务
  monitor-service:
    build:
      context: ./packages/monitor-service
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=carbon_main
      - DB_USER=carbon
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  # 知识库服务
  knowledge-service:
    build:
      context: ./packages/knowledge-service
      dockerfile: Dockerfile
    ports:
      - "3007:3007"
    environment:
      - MONGO_URI=mongodb://mongo:27017/carbon_knowledge
      - MINIO_ENDPOINT=minio
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
    depends_on:
      - mongo
    restart: unless-stopped

  # 系统管理服务
  system-service:
    build:
      context: ./packages/system-service
      dockerfile: Dockerfile
    ports:
      - "3009:3009"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=carbon_main
      - DB_USER=carbon
      - DB_PASSWORD=${DB_PASSWORD}
      - MONGO_URI=mongodb://mongo:27017/carbon_knowledge
    depends_on:
      - mysql
      - mongo
    restart: unless-stopped

  # AI智能体服务
  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - MONGO_URI=mongodb://mongo:27017/carbon_knowledge
      - CARBON_SERVICE_URL=http://carbon-service:3002
      - MONITOR_SERVICE_URL=http://monitor-service:3003
    depends_on:
      - mongo
    restart: unless-stopped

  # MySQL数据库
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=carbon_main
      - MYSQL_USER=carbon
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-sql:/docker-entrypoint-initdb.d
    restart: unless-stopped

  # Redis缓存
  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # MongoDB文档数据库
  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # MinIO对象存储
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  mongo_data:
  minio_data:
